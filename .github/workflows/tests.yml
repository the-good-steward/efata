name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run tests
        # The signed-in tests skip automatically when the account
        # secrets are absent, so this still passes on a fork or before
        # the secrets are added.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        # Output is captured so a failure can be read on the run summary
        # rather than by digging into a log or downloading an artifact.
        run: npm run e2e 2>&1 | tee /tmp/e2e.log

      - name: Put the failure on the summary
        if: failure()
        run: |
          {
            echo "## Test failures"
            echo
            echo '```'
            # The lines that name what broke: failing tests, the
            # assertion, and the counts.
            grep -E "✘|✗|Error:|expect\(|Received|Timed out|[0-9]+ failed|[0-9]+ passed" /tmp/e2e.log \
              | head -60 || tail -60 /tmp/e2e.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
